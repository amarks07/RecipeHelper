name: Build Android APK

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Requires EXPO_TOKEN in repo secrets (Settings > Secrets and variables > Actions).
      # Generate one at https://expo.dev/settings/access-tokens
      - name: Build Android APK via EAS
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json --clear-cache > eas-output.json

      - name: Extract APK download URL
        id: extract_url
        working-directory: apps/mobile
        run: |
          URL=$(node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('eas-output.json', 'utf8'));
            const build = Array.isArray(data) ? data[0] : data;
            const url = build && build.artifacts && build.artifacts.buildUrl;
            if (!url) { console.error('No buildUrl found in EAS build output:'); console.error(JSON.stringify(build, null, 2)); process.exit(1); }
            console.log(url);
          ")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        working-directory: apps/mobile
        run: curl -fL -o recipehelper.apk "${{ steps.extract_url.outputs.url }}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mobile-v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apps/mobile/recipehelper.apk --clobber
          else
            gh release create "$TAG" apps/mobile/recipehelper.apk \
              --title "RecipeHelper Android v${{ steps.version.outputs.version }}" \
              --notes "Automated Android build from commit ${{ github.sha }}."
          fi

      # Update current app version in Supabase so the mobile app can check for updates
      # Requires SUPABASE_SERVICE_ROLE_KEY repo secret (Settings > Secrets and variables > Actions)
      - name: Update current app version in Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          curl -sf -X POST "${{ env.SUPABASE_URL }}/rest/v1/app_config" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"id\": true, \"mobile_version\": \"${{ steps.version.outputs.version }}\"}"
